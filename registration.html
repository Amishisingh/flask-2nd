<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div align="center">
        <div align="center" class="border">
            <div class="header">
                <h1 class="word">Registration</h1>
            </div>
            <h2 class="word">
                <form action="/registration" method="POST">
                    <div class="msg">{{msg}}</div>
                    <input id="username" name="username" placeholder="Enter your username" class="textbox" type="text">
                    <br><br>
                    <input id="password" name="password" placeholder="Enter your password" class="textbox" type="text">
                    <br><br>
                    <input id="Email" name="Email" placeholder="Enter your Email" class="textbox" type="text">
                    <br><br>
                    <input class="btn" type="submit" value="Sign up">
                    <br><br>
                </form>
            </h2>
            <p class="bottom">Already have account?<a href="/login" class="bottom">Sign in here</a></p>
        </div>
    </div>
</body>

</html>
