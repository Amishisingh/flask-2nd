<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <div align="center">
        <div align="center" class="border">
            <div class="header">
                <h1 class="word">Login</h1>
            </div>
            <h2 class="word">
                <form action="/login" method="POST">
                    <div class="msg">{{msg}}</div>
                    <input id="username" name="username" placeholder="Enter your username" class="textbox" type="text">
                    <br><br>
                    <input id="password" name="password" placeholder="Enter your password" class="textbox"
                        type="password">
                    <br><br>
                    <input value="Sign In" class="btn" type="submit">
                    <br><br>
                </form>
            </h2>
            <p class="bottom">Dont have an account?
                <a href="/register" class="bottom">Sign up here</a>
            </p>
        </div>
    </div>
</body>

</html>
